<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katha AAC — Mobile Phone Emulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background, #0f172a);
      color: var(--foreground, #f8fafc);
      overflow-x: hidden;
    }

    .sinhala-text {
      font-family: 'Noto Sans Sinhala', 'Plus Jakarta Sans', sans-serif;
    }

    /* Device frame styling */
    .device-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 0 0 2px rgba(255, 255, 255, 0.15);
    }
    
    .tablet-shadow {
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    /* Waveform animation */
    @keyframes wavePulse {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }

    .wave-bar {
      animation: wavePulse 0.8s ease-in-out infinite;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100,116,139,0.3);
      border-radius: 9999px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Touch button active animations */
    .cell-press:active {
      transform: scale(0.95);
      transition: transform 0.08s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4">

  <!-- TOP APP HEADER & CONTROLS -->
  <header class="w-full max-w-5xl mb-3 bg-slate-900/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 border border-slate-800 shadow-xl flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-blue-500/20">
        K
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold tracking-tight text-white">Katha AAC · Sinhala Speech Enabled</h1>
          <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Sinhala Audio Active</span>
        </div>
        <p class="text-xs text-slate-400">Tap pictograms to build phrase → Click 'කියන්න (Speak)' to play in Sinhala</p>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Device Selector -->
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
        <button id="btn-phone" onclick="setDeviceMode('phone')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-slate-700 text-white shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          📱 Phone View
        </button>
        <button id="btn-tablet" onclick="setDeviceMode('tablet')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          💻 10" Tablet
        </button>
      </div>

      <!-- Zoom Scale Controls -->
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
        <span class="text-[11px] text-slate-400 font-medium px-2">Zoom:</span>
        <button id="zoom-100" onclick="setZoom(1.0)" class="px-2 py-1 rounded-lg text-xs font-semibold bg-slate-700 text-white transition-all">100%</button>
        <button id="zoom-85" onclick="setZoom(0.85)" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">85%</button>
        <button id="zoom-70" onclick="setZoom(0.70)" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">70%</button>
      </div>

      <!-- Color Theme Switcher -->
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
        <button id="theme-light" onclick="setColorTheme('light')" class="px-2 py-1 rounded-lg text-xs font-medium text-slate-300 hover:text-white bg-slate-700">
          Light
        </button>
        <button id="theme-dark" onclick="setColorTheme('dark')" class="px-2 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white">
          Dark
        </button>
      </div>

      <!-- Audio Mute Switch -->
      <button id="btn-audio" onclick="toggleAudio()" class="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition-colors" title="Toggle audio sound effects">
        <svg id="audio-icon-on" class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="audio-icon-off" class="w-4 h-4 text-slate-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>

      <!-- Open in New Window Button -->
      <button onclick="popOutWindow()" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all" title="Open emulator in standalone popup window">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        New Window
      </button>
    </div>
  </header>

  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="fixed top-16 right-6 z-50 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-xl border border-slate-700 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2 flex items-center gap-2">
    <span id="toast-icon">ℹ️</span>
    <span id="toast-text">Message</span>
  </div>

  <!-- EMULATOR MAIN WORKSPACE -->
  <main class="w-full flex flex-col items-center justify-center my-auto transition-all">

    <!-- HARDWARE PHONE CONTAINER (Phone Mode) -->
    <div id="phone-wrapper" class="relative transition-all duration-300">
      
      <!-- Phone Bezel & Body -->
      <div id="phone-chassis" class="w-[390px] h-[810px] rounded-[52px] p-3.5 bg-gradient-to-b from-slate-700 via-slate-800 to-slate-900 device-shadow relative border-4 border-slate-600/60 flex flex-col">
        
        <!-- Physical Volume Buttons (Left side) -->
        <div class="absolute -left-[7px] top-28 w-[3px] h-10 bg-slate-600 rounded-l-md"></div>
        <div class="absolute -left-[7px] top-42 w-[3px] h-10 bg-slate-600 rounded-l-md"></div>
        <!-- Physical Power Button (Right side) -->
        <div class="absolute -right-[7px] top-32 w-[3px] h-14 bg-slate-600 rounded-r-md"></div>

        <!-- Phone Display Screen -->
        <div id="phone-screen" class="w-full h-full rounded-[40px] overflow-hidden flex flex-col relative select-none transition-colors duration-200 bg-[#FAF7F2] text-[#1F2933]">
          
          <!-- Modern Dynamic Island / Notch + Status Bar -->
          <div class="w-full pt-3 px-6 pb-1.5 flex items-center justify-between text-xs font-semibold z-20 shrink-0">
            <!-- Time -->
            <span id="phone-clock" class="text-[12px] font-bold tracking-tight">09:41</span>
            
            <!-- Dynamic Island -->
            <div class="w-24 h-5 bg-black rounded-full flex items-center justify-end px-2 gap-1.5 shadow-sm">
              <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700"></div>
              <div class="w-1.5 h-1.5 rounded-full bg-blue-500/60 animate-pulse"></div>
            </div>

            <!-- Signal / WiFi / Battery -->
            <div class="flex items-center gap-1.5 text-[11px]">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17.778 8.222c-4.296-4.296-11.26-4.296-15.556 0A1 1 0 01.808 6.808c5.076-5.077 13.308-5.077 18.384 0a1 1 0 01-1.414 1.414zM14.95 11.05a7 7 0 00-9.9 0 1 1 0 01-1.414-1.414 9 9 0 0112.728 0 1 1 0 01-1.414 1.414zm-2.829 2.828a3 3 0 00-4.242 0 1 1 0 01-1.415-1.414 5 5 0 017.072 0 1 1 0 01-1.415 1.414zM10 16a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
              <div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
                <div class="h-full w-3.5 bg-current rounded-2xs"></div>
              </div>
            </div>
          </div>

          <!-- Phone View Content Router (Scrollable) -->
          <div id="phone-content" class="w-full flex-1 overflow-y-auto overflow-x-hidden flex flex-col relative">
            <!-- Dynamically populated via JS -->
          </div>

          <!-- NATIVE MOBILE BOTTOM NAVIGATION BAR -->
          <nav id="phone-bottom-nav" class="w-full h-16 border-t flex items-center justify-around px-2 py-1 shrink-0 z-30 transition-colors shadow-sm bg-white border-slate-200">
            
            <!-- Tab 1: Child Board -->
            <button onclick="changeScreen('board')" id="pnav-board" class="flex-1 flex flex-col items-center justify-center py-1 transition-all group">
              <div class="pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all bg-blue-50 text-blue-600 scale-105">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <span class="tab-label text-[10px] font-bold mt-0.5 text-blue-600 tracking-tight">Child Board</span>
            </button>

            <!-- Tab 2: Facilitator Area -->
            <button onclick="changeScreen('facilitator')" id="pnav-facilitator" class="flex-1 flex flex-col items-center justify-center py-1 transition-all group">
              <div class="pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all text-slate-500 hover:text-slate-900">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <span class="tab-label text-[10px] font-medium mt-0.5 text-slate-500 tracking-tight">Facilitator</span>
            </button>

            <!-- Tab 3: Insights & Charts -->
            <button onclick="changeScreen('charts')" id="pnav-charts" class="flex-1 flex flex-col items-center justify-center py-1 transition-all group">
              <div class="pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all text-slate-500 hover:text-slate-900">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
              </div>
              <span class="tab-label text-[10px] font-medium mt-0.5 text-slate-500 tracking-tight">Insights</span>
            </button>

            <!-- Tab 4: Pictograms & Tokens -->
            <button onclick="changeScreen('tokens')" id="pnav-tokens" class="flex-1 flex flex-col items-center justify-center py-1 transition-all group">
              <div class="pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all text-slate-500 hover:text-slate-900">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
              <span class="tab-label text-[10px] font-medium mt-0.5 text-slate-500 tracking-tight">Library</span>
            </button>

          </nav>

          <!-- Bottom Home Bar Indicator -->
          <div class="w-full py-1.5 flex items-center justify-center shrink-0 z-20">
            <div class="w-32 h-1 bg-slate-400/50 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- HARDWARE TABLET CONTAINER (Tablet Mode) -->
    <div id="tablet-wrapper" class="hidden relative transition-all duration-300">
      
      <!-- Tablet Bezel & Body (Landscape 10") -->
      <div id="tablet-chassis" class="w-[980px] h-[640px] rounded-[44px] p-4 bg-gradient-to-r from-slate-700 via-slate-800 to-slate-900 tablet-shadow relative border-4 border-slate-600/70 flex flex-col">
        
        <!-- Front Camera in landscape bezel (Top center) -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-600 flex items-center justify-center">
          <div class="w-1 h-1 rounded-full bg-blue-900"></div>
        </div>

        <!-- Stereo Speaker Grilles -->
        <div class="absolute -left-1.5 top-1/2 -translate-y-1/2 flex flex-col gap-1">
          <div class="w-1 h-4 bg-slate-600 rounded"></div>
          <div class="w-1 h-4 bg-slate-600 rounded"></div>
        </div>
        <div class="absolute -right-1.5 top-1/2 -translate-y-1/2 flex flex-col gap-1">
          <div class="w-1 h-4 bg-slate-600 rounded"></div>
          <div class="w-1 h-4 bg-slate-600 rounded"></div>
        </div>

        <!-- Tablet Display Screen -->
        <div id="tablet-screen" class="w-full h-full rounded-[30px] overflow-hidden flex flex-col relative select-none transition-colors duration-200 bg-[#FAF7F2] text-[#1F2933]">
          
          <!-- Tablet Android System Bar -->
          <div id="tablet-sys-bar" class="w-full py-1.5 px-6 flex items-center justify-between text-xs font-medium border-b border-black/5 z-20 shrink-0">
            <span class="text-[12px] font-semibold opacity-75">10:00 AM · Katha AAC Tablet</span>
            <div class="flex items-center gap-3">
              <span class="text-[11px] opacity-75">Sinhala Speech Engine Ready</span>
              <div class="flex items-center gap-1.5 opacity-80">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
                <div class="w-4 h-2.5 border border-current rounded-xs p-0.5"><div class="h-full w-2.5 bg-current"></div></div>
              </div>
            </div>
          </div>

          <!-- Tablet Content Router -->
          <div id="tablet-content" class="w-full flex-1 overflow-hidden flex flex-col relative">
            <!-- Dynamically populated via JS -->
          </div>
        </div>
      </div>
    </div>

  </main>

    // --- 3. APPLICATION STATE ---
    let appState = {
      device: 'phone', // default 'phone' view
      theme: 'light',
      screen: 'board', // 'board' | 'facilitator' | 'charts' | 'tokens'
      audioEnabled: true,
      message: [],
      isSpeaking: false,
      showAdultChip: false,
      pinInput: '',
      activeRole: 'parent',
      lastSpokenText: '',
    };

    const THEMES = {
      light: {
        bg: '#FAF7F2',
        surface: '#FFFFFF',
        ink: '#1F2933',
        inkMuted: '#52606D',
        border: '#D9D4CC',
        selected: '#2563EB',
        selectedSoft: '#EEF3FE',
        placeholder: '#F1EDE6',
      },
      dark: {
        bg: '#15191E',
        surface: '#222831',
        ink: '#F3F4F6',
        inkMuted: '#AAB4BE',
        border: '#3B4450',
        selected: '#60A5FA',
        selectedSoft: '#1E2A44',
        placeholder: '#1E242B',
      }
    };

    let audioCtx = null;
    function playTapSound(freq = 520, duration = 0.06) {
      if (!appState.audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Ensure voices are loaded in modern browsers
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // --- 4. SINHALA SPEECH SYNTHESIS ENGINE ---
    // Speaks the text accurately in Sinhala using native Sinhala voice or phonetic Indic synthesis
    function speakSinhala(sinhalaText, phoneticText, updateUiSpeaking = true) {
      if (!appState.audioEnabled) return;

      playTapSound(640, 0.08);

      if (updateUiSpeaking) {
        appState.isSpeaking = true;
        appState.lastSpokenText = sinhalaText;
        renderCurrentScreen();
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const voices = window.speechSynthesis.getVoices();
        
        // 1. Try finding genuine native Sinhala voice (e.g. Edge Microsoft Thilini / Prasad / si-LK)
        const sinhalaVoice = voices.find(v => 
          (v.lang && (v.lang.toLowerCase().startsWith('si') || v.lang === 'si-LK')) ||
          (v.name && (v.name.toLowerCase().includes('sinhala') || v.name.toLowerCase().includes('thilini') || v.name.toLowerCase().includes('prasad')))
        );

        // 2. Try finding Indian English or Indic voice as closest natural South Asian accent
        const indicVoice = voices.find(v => 
          v.lang === 'en-IN' || v.lang === 'hi-IN' || (v.name && v.name.toLowerCase().includes('india'))
        );

        let utterText = sinhalaText;
        let selectedVoice = null;

        if (sinhalaVoice) {
          // Native Sinhala voice available
          utterText = sinhalaText;
          selectedVoice = sinhalaVoice;
        } else {
          // Fallback for Windows default installs lacking si-LK voice:
          // Uses phonetic Sinhala so the synthesizer articulates genuine Sinhala words instead of silence!
          utterText = phoneticText || sinhalaText;
          selectedVoice = indicVoice || null;
        }

        const utter = new SpeechSynthesisUtterance(utterText);
        if (selectedVoice) {
          utter.voice = selectedVoice;
          utter.lang = selectedVoice.lang;
        } else {
          utter.lang = sinhalaVoice ? 'si-LK' : 'en-US';
        }

        utter.rate = 0.85; // Slightly slower, clear enunciation for child AAC
        utter.pitch = 1.05; // Friendly child-like pitch

        utter.onend = () => {
          if (updateUiSpeaking) {
            appState.isSpeaking = false;
            appState.showAdultChip = true;
            renderCurrentScreen();
            setTimeout(() => {
              if (appState.showAdultChip) {
                appState.showAdultChip = false;
                renderCurrentScreen();
              }
            }, 6000);
          }
        };

        utter.onerror = () => {
          if (updateUiSpeaking) {
            appState.isSpeaking = false;
            appState.showAdultChip = true;
            renderCurrentScreen();
          }
        };

        window.speechSynthesis.speak(utter);
      } else {
        if (updateUiSpeaking) {
          setTimeout(() => {
            appState.isSpeaking = false;
            appState.showAdultChip = true;
            renderCurrentScreen();
          }, 1200);
        }
      }
    }

    // --- 5. AAC COMPOSER ACTIONS ---

    function addSymbolToMessage(cell) {
      if (cell.state === 'hidden') return;

      // Add to message bar
      appState.message.push({
        id: cell.id + '-' + Date.now(),
        label: cell.label,
        en: cell.en,
        phonetic: cell.phonetic,
        pictogram: cell.pictogram,
        wordClass: cell.wordClass,
      });

      if (appState.message.length === 0) return;
      playTapSound(320, 0.08);

      if (appState.message.length === 0) return;
      playTapSound(260, 0.12);

      appState.showAdultChip = false;
      renderCurrentScreen();
      showToast('Message bar cleared', '🗑️');

    function speakCurrentMessage() {
      if (appState.message.length === 0) {

        return;
      }

      const sinhalaSentence = appState.message.map(s => s.label).join(' ');
      const phoneticSentence = appState.message.map(s => s.phonetic || s.label).join(' ');
      
      showToast('🗣️ Playing Sinhala: ' + sinhalaSentence + ' (' + phoneticSentence + ')', '🔊');
      speakSinhala(sinhalaSentence, phoneticSentence, true);
    }

      playTapSound(600, 0.08);

    // [C] Screen: Charts & Analytics
    function renderChartsScreen() {

          <!-- SVG Bar Chart -->
          <div class="p-3 rounded-2xl border" style="background-color: ${curTheme.surface}; border-color: ${curTheme.border}">

            <div class="w-full h-28 flex items-end justify-between gap-2 pt-2 px-1 border-b border-slate-200">

                </div>
              `).join('')}

          </div>

          <!-- SVG Line Chart -->
          <div class="p-3 rounded-2xl border" style="background-color: ${curTheme.surface}; border-color: ${curTheme.border}">

              <span class="text-[10px] text-slate-400">Baseline = 0.19</span>

            <div class="w-full h-24 relative flex items-center justify-center">

            <div class="flex items-center justify-center gap-4 text-[9px] font-semibold mt-1">
              <span class="flex items-center gap-1 text-blue-600"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span> Condition A</span>

    // [D] Screen: Tokens & Pictograms
    function renderTokensScreen() {
      const curTheme = THEMES[appState.theme];
      const allPicKeys = Object.keys(pictograms);

      return `
        <div class="p-3.5 flex flex-col gap-3 overflow-y-auto h-full" style="background-color: ${curTheme.bg}; color: ${curTheme.ink}">
          
          <div class="flex items-center justify-between pb-1.5 border-b" style="border-color: ${curTheme.border}">
            <div>
              <h2 class="text-sm font-bold">Vocabulary Pictograms</h2>
              <p class="text-[10px] text-slate-500">45 ARASAAC-style Placeholder SVGs</p>
            </div>
            <span class="text-[10px] font-bold text-slate-400">${allPicKeys.length} Icons</span>
          </div>

          <!-- Color Tokens Palette -->
          <div class="p-2.5 rounded-xl border" style="background-color: ${curTheme.surface}; border-color: ${curTheme.border}">

            <div class="grid grid-cols-5 gap-1.5 text-center text-[8px] font-bold">
              <div class="p-1 rounded-lg bg-[#F2C94C] text-slate-900">People</div>
              <div class="p-1 rounded-lg bg-[#6FCF97] text-slate-900">Action</div>
              <div class="p-1 rounded-lg bg-[#56CCF2] text-slate-900">Describing</div>
              <div class="p-1 rounded-lg bg-[#F2994A] text-slate-900">Thing</div>

                <div class="w-9 h-9 flex items-center justify-center">

    // --- 7. ROUTER & CONTROLLER ---

    function renderCurrentScreen() {
      const isTablet = appState.device === 'tablet';
      const containerId = isTablet ? 'tablet-content' : 'phone-content';
      const container = document.getElementById(containerId);
      if (!container) return;

      let html = '';
      switch (appState.screen) {
        case 'board':
          html = renderBoardScreen(isTablet);
          break;
        case 'facilitator':
          html = renderFacilitatorScreen();
          break;
        case 'charts':
          html = renderChartsScreen();
          break;
        case 'tokens':
          html = renderTokensScreen();
          break;
        default:
          html = renderBoardScreen(isTablet);
      }

      container.innerHTML = html;
    }

    function setDeviceMode(mode) {
      playTapSound(500, 0.05);
      appState.device = mode;

      const phoneWrapper = document.getElementById('phone-wrapper');
      const tabletWrapper = document.getElementById('tablet-wrapper');
      const btnPhone = document.getElementById('btn-phone');
      const btnTablet = document.getElementById('btn-tablet');

      if (mode === 'phone') {
        phoneWrapper.classList.remove('hidden');
        tabletWrapper.classList.add('hidden');
        btnPhone.classList.add('bg-slate-700', 'text-white');
        btnPhone.classList.remove('text-slate-400');
        btnTablet.classList.remove('bg-slate-700', 'text-white');
        btnTablet.classList.add('text-slate-400');
      } else {
        tabletWrapper.classList.remove('hidden');
        phoneWrapper.classList.add('hidden');
        btnTablet.classList.add('bg-slate-700', 'text-white');
        btnTablet.classList.remove('text-slate-400');
        btnPhone.classList.remove('bg-slate-700', 'text-white');
        btnPhone.classList.add('text-slate-400');
      }

      renderCurrentScreen();
      showToast('Switched to ' + (mode === 'phone' ? 'Phone View' : '10" Tablet View'), '🔄');
    }

    function setColorTheme(themeName) {
      appState.theme = themeName;
      ['light', 'dark'].forEach(t => {
        const btn = document.getElementById('theme-' + t);
        if (btn) {
          if (t === themeName) {
            btn.classList.add('bg-slate-700', 'text-white');
            btn.classList.remove('text-slate-400');
          } else {
            btn.classList.remove('bg-slate-700', 'text-white');
            btn.classList.add('text-slate-400');
          }
        }
      });

      const theme = THEMES[themeName];
      document.getElementById('phone-screen').style.backgroundColor = theme.bg;
      document.getElementById('tablet-screen').style.backgroundColor = theme.bg;
      
      const bottomNav = document.getElementById('phone-bottom-nav');
      if (bottomNav) {
        bottomNav.style.backgroundColor = theme.surface;
        bottomNav.style.borderColor = theme.border;
      }

      renderCurrentScreen();
      showToast('Theme set to ' + themeName.toUpperCase(), '🎨');
    }

    function changeScreen(screenKey) {
      appState.screen = screenKey;

      // Update Native Phone Bottom Navigation Bar
      const navKeys = ['board', 'facilitator', 'charts', 'tokens'];
      navKeys.forEach(k => {
        const btn = document.getElementById('pnav-' + k);
        if (btn) {
          const pill = btn.querySelector('.pill-badge');
          const label = btn.querySelector('.tab-label');
          if (k === screenKey) {
            pill.className = 'pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all bg-blue-50 text-blue-600 scale-105';
            label.className = 'tab-label text-[10px] font-bold mt-0.5 text-blue-600 tracking-tight';
          } else {
            pill.className = 'pill-badge w-12 h-7 rounded-full flex items-center justify-center transition-all text-slate-500 hover:text-slate-900';
            label.className = 'tab-label text-[10px] font-medium mt-0.5 text-slate-500 tracking-tight';
          }
        }
      });

      renderCurrentScreen();
      showToast('Switched to: ' + screenKey, '📄');
    }

    function setRole(role) {
      playTapSound(600, 0.06);
      appState.activeRole = role;
      renderCurrentScreen();
      showToast('Role: ' + role.toUpperCase(), '👤');
    }

    function enterPin(digit) {
      playTapSound(520, 0.06);
      if (digit === 'clear') {
        appState.pinInput = '';
      } else if (digit === 'back') {
        appState.pinInput = appState.pinInput.slice(0, -1);
      } else {
        if (appState.pinInput.length < 4) {
          appState.pinInput += digit;
          if (appState.pinInput.length === 4) {
            if (appState.pinInput === '1234') {
              showToast('PIN Verified! Access granted.', '🔓');
            } else {
              showToast('Invalid PIN (D-04)', '❌');
            }
          }
        }
      }
      renderCurrentScreen();
    }

    function toggleAudio() {
      appState.audioEnabled = !appState.audioEnabled;
      document.getElementById('audio-icon-on').classList.toggle('hidden', !appState.audioEnabled);
      document.getElementById('audio-icon-off').classList.toggle('hidden', appState.audioEnabled);
      showToast(appState.audioEnabled ? 'Audio unmuted' : 'Audio muted', appState.audioEnabled ? '🔊' : '🔇');
    }

    function showToast(text, icon = 'ℹ️') {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');
      toastText.innerText = text;
      toastIcon.innerText = icon;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }, 2500);
    }

    let currentZoom = 1.0;
    function setZoom(scale) {
      currentZoom = scale;
      ['100', '85', '70'].forEach(z => {
        const btn = document.getElementById('zoom-' + z);
        if (btn) {
          const targetScale = z === '100' ? 1.0 : z === '85' ? 0.85 : 0.70;
          if (Math.abs(scale - targetScale) < 0.01) {
            btn.classList.add('bg-slate-700', 'text-white');
            btn.classList.remove('text-slate-400');
          } else {
            btn.classList.remove('bg-slate-700', 'text-white');
            btn.classList.add('text-slate-400');
          }
        }
      });
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.style.transform = 'scale(' + scale + ')';
        mainContainer.style.transformOrigin = 'top center';
      }
      showToast('Zoom set to ' + Math.round(scale * 100) + '%', '🔍');
    }

    function popOutWindow() {
      const url = window.location.href;
      window.open(url, 'KathaEmulatorPopup', 'width=1120,height=880,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
    }

    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('phone-clock');
      if (clockEl) clockEl.innerText = hrs + ':' + mins;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Default to Mobile Phone View
    setDeviceMode('phone');
  </script>
